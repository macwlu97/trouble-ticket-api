spring:
  application:
    name: trouble-ticket-api

  datasource:
    url: jdbc:postgresql://localhost:5432/trouble_ticket
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui