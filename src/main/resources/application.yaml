spring:
  application:
    name: trouble-ticket-api

  datasource:
    url: jdbc:postgresql://localhost:5432/trouble_ticket
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui