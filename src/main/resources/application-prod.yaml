spring:

  application:
    name: trouble-ticket-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui